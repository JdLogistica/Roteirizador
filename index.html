<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="origin">
  <title>Roteirizador</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
</head>
<body>

  <!-- ================= LOGIN ================= -->
  <main id="view-login" class="login-wrap">
    <form id="login-form" class="login-card" autocomplete="on" novalidate>
      <div class="brand big">
        <span class="brand-mark">R</span>
        <h1>Roteirizador</h1>
      </div>
      <p class="muted">Acesso restrito. Entre com seu usuário e senha.</p>

      <div id="config-warning" class="banner warn" hidden></div>

      <label for="login-user">Usuário</label>
      <input id="login-user" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>

      <label for="login-pass">Senha</label>
      <input id="login-pass" name="password" type="password" autocomplete="current-password" required>

      <div id="login-error" class="banner error" role="alert" hidden></div>

      <button id="login-btn" type="submit" class="btn primary block">Entrar</button>
    </form>
  </main>

  <!-- ================= APP ================= -->
  <div id="view-app" class="app" hidden>
    <header class="topbar">
      <div class="brand"><span class="brand-mark">R</span><span>Roteirizador</span></div>
      <div class="topbar-right">
        <span id="user-label" class="muted small"></span>
        <button id="logout-btn" class="btn ghost small" type="button">Sair</button>
      </div>
    </header>

    <div class="layout">
      <section class="map-pane">
        <div id="map" aria-label="Mapa"></div>
      </section>

      <aside class="side-pane">
        <nav class="tabs" role="tablist">
          <button class="tab active" data-tab="plan" role="tab" type="button">Planejar</button>
          <button class="tab" data-tab="history" role="tab" type="button">Histórico</button>
        </nav>

        <!-- ---------- PLANEJAR ---------- -->
        <div id="tab-plan" class="tab-body">
          <div id="provider-warning" class="banner warn" hidden></div>

          <div class="field-row">
            <div class="field grow">
              <label for="route-name">Nome da rota</label>
              <input id="route-name" type="text" placeholder="Ex.: Visitas zona sul" maxlength="80">
            </div>
          </div>

          <div class="field-row">
            <div class="field grow">
              <label for="route-date">Dia</label>
              <input id="route-date" type="date">
            </div>
            <div class="field">
              <label for="route-time">Saída</label>
              <input id="route-time" type="time">
            </div>
          </div>

          <div class="field">
            <label for="origin-input">Ponto de partida</label>
            <div class="ac">
              <input id="origin-input" type="text" placeholder="Buscar endereço ou local…" autocomplete="off">
              <ul id="origin-list" class="ac-list" role="listbox" hidden></ul>
            </div>
            <div class="row-gap">
              <button id="geo-btn" type="button" class="btn ghost small">📍 Usar minha localização</button>
            </div>
            <div id="origin-card" class="origin-card" hidden>
              <span class="num origin">P</span>
              <div class="info">
                <div id="origin-name" class="name"></div>
                <div id="origin-addr" class="addr"></div>
              </div>
              <button id="origin-clear" type="button" class="icon-btn" title="Remover partida">✕</button>
            </div>
          </div>

          <label class="check">
            <input id="return-chk" type="checkbox" checked>
            <span>Voltar ao ponto de partida no final</span>
          </label>
          <p id="return-hint" class="muted small" hidden>Sem retorno: o último ponto da lista é o destino final (fica fixo na otimização).</p>

          <div class="field">
            <label for="stop-input">Adicionar ponto</label>
            <div class="ac">
              <input id="stop-input" type="text" placeholder="Buscar local (nome ou endereço)…" autocomplete="off">
              <ul id="stop-list" class="ac-list" role="listbox" hidden></ul>
            </div>
          </div>

          <ol id="stops" class="stops"></ol>
          <p id="stops-empty" class="muted small center">Nenhum ponto adicionado ainda.</p>

          <div class="btn-row">
            <button id="calc-btn" type="button" class="btn primary">Calcular rota</button>
            <button id="opt-btn" type="button" class="btn">⚡ Otimizar ordem</button>
          </div>

          <div id="summary" class="summary" hidden></div>

          <div class="btn-row">
            <button id="save-btn" type="button" class="btn success">💾 Salvar rota</button>
            <a id="gmaps-link" class="btn" target="_blank" rel="noopener" hidden>Abrir no Google Maps ↗</a>
            <button id="clear-btn" type="button" class="btn ghost">Nova rota</button>
          </div>
        </div>

        <!-- ---------- HISTÓRICO ---------- -->
        <div id="tab-history" class="tab-body" hidden>
          <div class="field-row">
            <div class="field grow">
              <label for="hist-date">Filtrar por dia</label>
              <input id="hist-date" type="date">
            </div>
            <div class="field">
              <label>&nbsp;</label>
              <button id="hist-all" type="button" class="btn ghost">Ver todos</button>
            </div>
          </div>
          <div id="hist-list" class="hist-list"></div>
        </div>
      </aside>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
